  "facts": [
    "All fourteen TTS components remain Alpha and live-unverified.",
    "Clean prerelease resolution exposed HTTPX 1.0.dev6 removal of AsyncClient.",
    "Corrected candidates constrain HTTPX >=0.27,<0.29 and require base >=0.11.0.dev12.",
    "OpenAI 0.1.0a1 uploaded before the initial batch was cancelled; 0.1.0a2 supersedes it.",
    "Core 0.11.0.dev7, typing 0.11.0.dev4 and storage_s3fs 0.11.0.dev3 already exist on PyPI.",
    "PyPI rejected Cartesia first publication with HTTP 429 Too many new projects created on 2026-11-18. No further new-project uploads were attempted after that response.",
    "The facade remains unpublished because its tts extra depends on ten still-unpublished providers.",
    "The TextToSpeechAgent wheel has only core/base runtime requirements; both were verified published before its release.",
    "Realtime downstream SDK Git references were replaced by exact PyPI pins and merged in tigrbl_realtime_ws_agent2user#3.",
    "Agent 0.11.0.dev5 is superseded by 0.11.0.dev6, fixing providers imported after the agent class and preserving serialized provider fields.",
    "Actual PyPI-installed target versions passed 97 offline tests on each of Python 3.10, 3.11 and 3.12; local wheels for all fourteen providers passed 302 offline tests per version."
  ],
