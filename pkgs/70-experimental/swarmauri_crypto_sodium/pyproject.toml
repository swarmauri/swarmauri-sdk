[project]
name = "swarmauri_crypto_sodium"
version = "0.11.0.dev1"
description = "Libsodium-backed crypto provider for Swarmauri"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri_crypto_sodium", "swarmauri", "experimental"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "swarmauri_core",
    "swarmauri_base",
    "ninja",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = ["combined", "scripts"]
markers = [
    "test: standard test",
    "unit: Unit tests",
    "i9n: Integration tests",
    "r8n: Regression tests",
    "acceptance: Acceptance tests",
    "perf: Performance tests",
]
timeout = 300
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope = "function"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/70-experimental/swarmauri_crypto_sodium"
layer = "experimental"
lifecycle = "experimental"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_crypto_sodium"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/70-experimental/swarmauri_crypto_sodium/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/70-experimental/swarmauri_crypto_sodium/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[build-system]
requires = ["meson-python>=0.15.0", "ninja"]
build-backend = "mesonpy"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-json-report>=1.5.0",
    "flake8>=7.0",
    "ruff>=0.9.9",
    "pytest-timeout>=2.3.1",
    "readme-standards==0.1.1; python_version >= \"3.11\"",
]

[project.entry-points.'swarmauri.cryptos']
SodiumCrypto = "swarmauri_crypto_sodium:SodiumCrypto"

[project.entry-points."peagen.plugins.cryptos"]
sodium = "swarmauri_crypto_sodium:SodiumCrypto"