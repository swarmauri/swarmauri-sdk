[project]
name = "swarmauri_canon_http"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri_canon_http", "swarmauri", "experimental"]
dependencies = ["httpx>=0.27.0", "pytest-asyncio>=0.23.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
swarmauri_transport_asgi = ["swarmauri_transport_asgi>=0.1.0"]
swarmauri_transport_h2 = ["swarmauri_transport_h2>=0.1.0"]
swarmauri_transport_h2mux = ["swarmauri_transport_h2mux>=0.1.0"]
swarmauri_transport_meshsidecarhttp2 = ["swarmauri_transport_meshsidecarhttp2>=0.1.0"]
swarmauri_transport_mtlsunicast = ["swarmauri_transport_mtlsunicast>=0.1.0"]
swarmauri_transport_quic = ["swarmauri_transport_quic>=0.1.0"]
swarmauri_transport_sseoutbound = ["swarmauri_transport_sseoutbound>=0.1.0"]
swarmauri_transport_sshtunnel = ["swarmauri_transport_sshtunnel>=0.1.0"]
swarmauri_transport_stdio = ["swarmauri_transport_stdio>=0.1.0"]
swarmauri_transport_tcpunicast = ["swarmauri_transport_tcpunicast>=0.1.0"]
swarmauri_transport_tls_unicast = ["swarmauri_transport_tls_unicast>=0.1.0"]
swarmauri_transport_udp = ["swarmauri_transport_udp>=0.1.0"]
swarmauri_transport_uds_unicast = ["swarmauri_transport_uds_unicast>=0.1.0"]
swarmauri_transport_wsjsonrpcmux = ["swarmauri_transport_wsjsonrpcmux>=0.1.0"]
transports = [
    "swarmauri_transport_asgi>=0.1.0",
    "swarmauri_transport_h2>=0.1.0",
    "swarmauri_transport_h2mux>=0.1.0",
    "swarmauri_transport_meshsidecarhttp2>=0.1.0",
    "swarmauri_transport_mtlsunicast>=0.1.0",
    "swarmauri_transport_quic>=0.1.0",
    "swarmauri_transport_sseoutbound>=0.1.0",
    "swarmauri_transport_sshtunnel>=0.1.0",
    "swarmauri_transport_stdio>=0.1.0",
    "swarmauri_transport_tcpunicast>=0.1.0",
    "swarmauri_transport_tls_unicast>=0.1.0",
    "swarmauri_transport_udp>=0.1.0",
    "swarmauri_transport_uds_unicast>=0.1.0",
    "swarmauri_transport_wsjsonrpcmux>=0.1.0",
]


[tool.uv.sources]
swarmauri_transport_asgi = { path = "../../40-standards/swarmauri_transport_asgi", editable = true }
swarmauri_transport_h2 = { path = "../../40-standards/swarmauri_transport_h2", editable = true }
swarmauri_transport_h2mux = { path = "../../40-standards/swarmauri_transport_h2mux", editable = true }
swarmauri_transport_meshsidecarhttp2 = { path = "../../40-standards/swarmauri_transport_meshsidecarhttp2", editable = true }
swarmauri_transport_mtlsunicast = { path = "../../40-standards/swarmauri_transport_mtlsunicast", editable = true }
swarmauri_transport_quic = { path = "../../40-standards/swarmauri_transport_quic", editable = true }
swarmauri_transport_sseoutbound = { path = "../../40-standards/swarmauri_transport_sseoutbound", editable = true }
swarmauri_transport_sshtunnel = { path = "../../40-standards/swarmauri_transport_sshtunnel", editable = true }
swarmauri_transport_stdio = { path = "../../40-standards/swarmauri_transport_stdio", editable = true }
swarmauri_transport_tcpunicast = { path = "../../40-standards/swarmauri_transport_tcpunicast", editable = true }
swarmauri_transport_tls_unicast = { path = "../../40-standards/swarmauri_transport_tls_unicast", editable = true }
swarmauri_transport_udp = { path = "../../40-standards/swarmauri_transport_udp", editable = true }
swarmauri_transport_uds_unicast = { path = "../../40-standards/swarmauri_transport_uds_unicast", editable = true }
swarmauri_transport_wsjsonrpcmux = { path = "../../40-standards/swarmauri_transport_wsjsonrpcmux", editable = true }

[tool.pytest.ini_options]
markers = [
    "test: standard test",
    "unit: Unit tests",
    "i9n: Integration tests",
    "r8n: Regression tests",
    "timeout: mark test to timeout after X seconds",
    "xpass: Expected passes",
    "xfail: Expected failures",
    "perf: Performance tests that measure execution time and resource usage",
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

asyncio_default_fixture_loop_scope = "function"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/70-experimental/swarmauri_canon_http"
layer = "experimental"
lifecycle = "experimental"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_canon_http"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/70-experimental/swarmauri_canon_http/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/70-experimental/swarmauri_canon_http/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[dependency-groups]
dev = [
    "pytest>=8.0",
    "requests>=2.32",
    "httpx[http2]>=0.27",
    "ruff>=0.11.0",
    "readme-standards==0.1.3; python_version >= \"3.11\"",
]
