[project]
name = "swarmauri_tests_readme_examples"
version = "0.11.0.dev3"
description = "Pytest plugin that executes README code examples."
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri_tests_readme_examples", "swarmauri", "experimental"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/swarmauri/swarmauri-sdk/pkgs/70-experimental/swarmauri_tests_readme_examples"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license-files = ["LICENSE", "NOTICE"]

[project.entry-points.pytest11]
swarmauri_tests_readme_examples = "swarmauri_tests_readme_examples"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-json-report>=1.5.0",
    "python-dotenv",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.9",
    "pytest-benchmark>=4.0.0",
    "readme-standards==0.1.3; python_version >= \"3.11\"",
]

[tool.pytest.ini_options]
addopts = ""

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/70-experimental/swarmauri_tests_readme_examples"
layer = "experimental"
lifecycle = "experimental"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_tests_readme_examples"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.sh"
test = "tests/unit/test_readme_sources.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.sh"
test = "tests/unit/test_readme_sources.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/70-experimental/swarmauri_tests_readme_examples/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/70-experimental/swarmauri_tests_readme_examples/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
