[project]
name = "swarmauri_certservice_gcpkms"
version = "0.11.0.dev3"
description = "Google Cloud KMS oriented Swarmauri certificate service for CSR creation, CSR signing, self-signed certificates, verification, and X.509 parsing."
license = "Apache-2.0"
readme = "README.md"
repository = "http://github.com/swarmauri/swarmauri-sdk"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
dependencies = [
    "cryptography",
    "swarmauri_core",
    "swarmauri_base",
    "swarmauri_standard",
]
keywords = [
    "swarmauri",
    "swarmauri certservice",
    "certificate service",
    "certservice",
    "gcp kms",
    "google cloud kms",
    "google",
    "cloud",
    "kms",
    "certificate",
    "csr signing",
    "self signed certificate",
    "x509",
    "pki",
    "cloud certificate management",
    "cryptography",
    "composable intelligence",
]
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
gcp = ["google-cloud-kms"]

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }
swarmauri_standard = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = ["combined", "scripts"]
markers = [
    "test: standard test",
    "unit: Unit tests",
    "i9n: Integration tests",
    "r8n: Regression tests",
    "timeout: mark test to timeout after X seconds",
    "xpass: Expected passes",
    "xfail: Expected failures",
    "acceptance: Acceptance tests",
    "perf: Performance tests that measure execution time and resource usage",
    "functional: Functional tests",
]
timeout = 300
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope = "function"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/50-community/swarmauri_certservice_gcpkms"
layer = "community"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_certservice_gcpkms"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/50-community/swarmauri_certservice_gcpkms/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/50-community/swarmauri_certservice_gcpkms/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[project.entry-points.'swarmauri.cert_services']
GcpKmsCertService = "swarmauri_certservice_gcpkms.GcpKmsCertService:GcpKmsCertService"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-json-report>=1.5.0",
    "python-dotenv",
    "httpx>=0.27",
    "flake8>=7.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.9",
    "pytest-benchmark>=4.0.0",
    "readme-standards==0.1.3; python_version >= \"3.11\"",
]
