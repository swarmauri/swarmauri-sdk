[project]
name = "layout_engine_atoms"
version = "0.1.0.dev1"
description = "Curated atom presets and registries for layout-engine."
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "layout-engine",
    "starlette",
    "uvicorn[standard]",
    "httpx>=0.27",
]
keywords = ["layout_engine_atoms", "swarmauri", "experimental"]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
layout_engine_atoms = [
    "runtime/vue/assets/layout-engine-vue/*.js",
    "runtime/vue/templates/*.html",
    "runtime/svelte/assets/layout-engine-svelte/*.js",
    "runtime/svelte/assets/layout-engine-svelte/*.css",
    "runtime/svelte/templates/*.html",
    "runtime/svelte/assets/swarma-svelte/*.js",
    "runtime/svelte/assets/swarma-svelte/*.css",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/experimental/layout_engine_atoms"
layer = "experimental"
lifecycle = "experimental"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "layout_engine_atoms"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.sh"
test = "tests/unit/test_readme_sources.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.sh"
test = "tests/unit/test_readme_sources.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/experimental/layout_engine_atoms/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/experimental/layout_engine_atoms/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "readme-standards==0.1.1; python_version >= \"3.11\"",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.uv.sources]
layout-engine = { path = "../layout_engine" }
