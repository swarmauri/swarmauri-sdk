[project]
name = "swarmauri_tool_replaceruntimetool"
version = "0.1.0"
description = "Replace a tool in a runtime toolkit."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "sdk", "replaceruntimetool", "tools"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["swarmauri_core>=0.11.0.dev6,<0.12", "swarmauri_base>=0.11.0.dev6,<0.12","swarmauri_standard>=0.11.0.dev8,<0.12"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.tools"]
ReplaceRuntimeTool = "swarmauri_tool_replaceruntimetool:ReplaceRuntimeTool"

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }
swarmauri_standard = { workspace = true }

[tool.pytest.ini_options]
markers = ["unit: Unit tests", "i9n: Integration tests"]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/40-standards/swarmauri_tool_replaceruntimetool"
layer = "standards"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_tool_replaceruntimetool"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/40-standards/swarmauri_tool_replaceruntimetool/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/40-standards/swarmauri_tool_replaceruntimetool/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.9", "readme-standards==0.1.3; python_version >= \"3.11\""]
