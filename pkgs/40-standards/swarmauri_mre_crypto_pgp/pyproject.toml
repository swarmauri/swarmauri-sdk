[project]
name = "swarmauri_mre_crypto_pgp"
version = "0.11.0.dev2"
description = "OpenPGP sealed-per-recipient MRE provider for Swarmauri"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
classifiers = [
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "swarmauri_core",
    "swarmauri_base",
    "pgpy>=0.6.0",
    "standard-imghdr>=3.13.0; python_version >= '3.13'",
]
keywords = [
    'swarmauri',
    'sdk',
    'standards',
    'mre',
    'crypto',
    'pgp',
    'cryptography',
]
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
pgpy = ["pgpy>=0.6.0"]
cryptography = ["cryptography>=41.0.0"]
cbor = ["cbor2>=5.4.6"]

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = ["combined", "scripts"]
markers = [
    "test: standard test",
    "unit: Unit tests",
    "i9n: Integration tests",
    "r8n: Regression tests",
    "acceptance: Acceptance tests",
    "perf: Performance tests",
    "example: Example usage tests",
]
timeout = 300
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope = "function"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/40-standards/swarmauri_mre_crypto_pgp"
layer = "standards"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_mre_crypto_pgp"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/40-standards/swarmauri_mre_crypto_pgp/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/40-standards/swarmauri_mre_crypto_pgp/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-json-report>=1.5.0",
    "flake8>=7.0",
    "ruff>=0.9.9",
    "pytest-timeout>=2.3.1",
    "pytest-benchmark>=4.0.0",
    "readme-standards==0.1.3; python_version >= \"3.11\"",
]

[project.entry-points.'swarmauri.mre_cryptos']
PGPSealMreCrypto = "swarmauri_mre_crypto_pgp:PGPSealMreCrypto"
PGPSealedCekMreCrypto = "swarmauri_mre_crypto_pgp.pgp_sealed_cek_mre:PGPSealedCekMreCrypto"
PGPMreCrypto = "swarmauri_mre_crypto_pgp.pgp_mre:PGPMreCrypto"

[project.entry-points."peagen.plugins.mre_cryptos"]
pgp_seal = "swarmauri_mre_crypto_pgp:PGPSealMreCrypto"
pgp_sealed_cek = "swarmauri_mre_crypto_pgp.pgp_sealed_cek_mre:PGPSealedCekMreCrypto"
pgp_mre = "swarmauri_mre_crypto_pgp.pgp_mre:PGPMreCrypto"
