[project]
name = "swarmauri_base"
version = "0.11.0"
description = "Reusable Swarmauri base classes, mixins, and dynamic Pydantic component models for composable intelligence infrastructure."
keywords = [
    "swarmauri",
    "base-classes",
    "mixins",
    "ai-sdk",
    "component-model",
    "component-registry",
    "composable-intelligence",
    "dynamic-json-schema",
    "discriminated-unions",
    "pydantic",
    "pydantic-models",
    "schema-first",
    "serialization",
    "yaml",
    "toml",
    "plugin-components",
    "typed-components",
]
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
license = "Apache-2.0"
readme = { file = "README.md", content-type = "text/markdown" }
repository = "http://github.com/swarmauri/swarmauri-sdk"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
requires-python = ">=3.10,<3.15"
dependencies = [
"pyyaml>=6.0.2",
"httpx>=0.27,<0.29",
"numpy>=1.26.4",
"pydantic>=2.0",
"starlette",
"swarmauri_core>=0.11.0,<0.12",
"swarmauri_typing>=0.11.0,<0.12",
"toml>=0.10.2",
"tomli>=2.0; python_version < '3.11'"
]
license-files = ["LICENSE", "NOTICE"]

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_typing = { workspace = true }
swarmauri_tests_pylicense = { workspace = true }

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/20-bases/swarmauri_base"
layer = "base"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_base"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/20-bases/swarmauri_base/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/20-bases/swarmauri_base/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[dependency-groups]
dev = [
    "toml>=0.10.2",
    "httpx>=0.27,<0.29",
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.1",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "pytest-json-report>=1.5.0",
    "python-dotenv>=1.0.0",
    "pytest-mock>=3.14.0",
    "jsonschema>=4.18.5",
    "ruff>=0.9.9",
    "pytest-benchmark>=4.0.0",
    "swarmauri_tests_pylicense",
    "readme-standards==0.1.3; python_version >= \"3.11\"",
]

[tool.pytest.ini_options]
timeout = 300

markers = [
    "test: standard test",
    "unit: Unit tests",
    "i9n: Integration Tests",
    "r8n: Regression Tests",
    "timeout: mark test to timeout after X seconds",
    "xfail: Expected failures",
    "xpass: Expected passes",
    "acceptance: Acceptance tests",
    "perf: Performance tests that measure execution time and resource usage"
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

asyncio_default_fixture_loop_scope = "function"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = [
    "B006",
    "B008",
    "BLE001",
    "C408",
    "C409",
    "E501",
    "N999",
    "PERF102",
    "PYI034",
    "RUF012",
    "RUF013",
    "SIM118",
    "TRY004",
    "TRY201",
    "UP007",
]
