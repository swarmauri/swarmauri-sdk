[project]
name = "swarmauri_agent_runner"
version = "0.1.2"
description = "Run model tool calls and resume checkpointed human interactions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "sdk", "runner", "execution"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["swarmauri_core>=0.11.0.dev8,<0.12","swarmauri_base>=0.11.0.dev13,<0.12","swarmauri_standard>=0.11.0.dev13,<0.12","swarmauri_tool_askuser>=0.1.0,<0.2"]

[project.optional-dependencies]
sqlite = ["swarmauri_runstore_sqlite>=0.1.0,<0.2"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.execution_drivers"]
AgentRunnerExecutionDriver = "swarmauri_agent_runner:AgentRunnerExecutionDriver"

[tool.uv.sources]
swarmauri_runstore_sqlite = { workspace = true }
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }
swarmauri_standard = { workspace = true }
swarmauri_tool_askuser = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["unit: Unit tests", "i9n: Integration tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["swarmauri_runstore_sqlite", "pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.9.9"]
