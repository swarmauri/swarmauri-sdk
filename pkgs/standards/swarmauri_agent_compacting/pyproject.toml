[project]
name = "swarmauri_agent_compacting"
version = "0.1.0.dev0"
description = "Swarmauri text agent with manual and token-triggered conversation compaction."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
license = "Apache-2.0"
dependencies = [
    "swarmauri_base>=0.11.0.dev5",
    "swarmauri_conversation_compacting>=0.1.0.dev0",
    "swarmauri_core>=0.11.0.dev5",
    "swarmauri_standard",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["swarmauri", "agent", "conversation", "summarization", "compaction"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.agents"]
CompactingAgent = "swarmauri_agent_compacting:CompactingAgent"

[tool.uv.sources]
swarmauri_base = { workspace = true }
swarmauri_conversation_compacting = { workspace = true }
swarmauri_core = { workspace = true }
swarmauri_standard = { workspace = true }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = [{ path = "NOTICE", format = ["sdist", "wheel"] }]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9.9"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/standards/swarmauri_agent_compacting"
layer = "standards"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_agent_compacting"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_CompactingAgent.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_CompactingAgent.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "package tests"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/standards/swarmauri_agent_compacting/tests/unit/test_CompactingAgent.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/standards/swarmauri_agent_compacting/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
