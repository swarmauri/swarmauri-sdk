[project]
name = "swarmauri_auth_idp_azure"
version = "0.11.0.dev4"
description = "Azure Active Directory OAuth 2.0 / 2.1 / OIDC 1.0 login implementations for Swarmauri deployments"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.15"
repository = "https://github.com/swarmauri/swarmauri-sdk"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
classifiers = ["Development Status :: 1 - Planning", "Intended Audience :: Developers", "Natural Language :: English", "Topic :: Internet :: WWW/HTTP", "Topic :: Security :: Cryptography", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
keywords = [
    "swarmauri",
    "sdk",
    "standards",
    "identity",
    "oauth2",
    "oauth21",
    "oidc",
    "azure",
    "microsoft",
]
dependencies = [
    "swarmauri_core",
    "swarmauri_base",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]
license-files = ["LICENSE", "NOTICE"]

[project.entry-points.'swarmauri.auth_idp']
AzureOAuth20Login = "swarmauri_auth_idp_azure:AzureOAuth20Login"
AzureOAuth21Login = "swarmauri_auth_idp_azure:AzureOAuth21Login"
AzureOIDC10Login = "swarmauri_auth_idp_azure:AzureOIDC10Login"

[tool.uv.sources]
swarmauri_tests_pylicense = { workspace = true }
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "test: standard test",
    "unit: Unit tests",
    "i9n: Integration tests",
    "r8n: Regression tests",
    "acceptance: Acceptance tests",
    "perf: Performance tests",
    "example: Documentation examples",
]
timeout = 300
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope = "function"
addopts = "--pylicense-accept-deps=sniffio"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/standards/swarmauri_auth_idp_azure"
layer = "standards"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_auth_idp_azure"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/standards/swarmauri_auth_idp_azure/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/standards/swarmauri_auth_idp_azure/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.9.9",
    "swarmauri_tests_pylicense",
    "readme-standards==0.1.1; python_version >= \"3.11\"",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
