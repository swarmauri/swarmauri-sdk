[project]
name = "swarmauri_toolkit_skillset"
version = "0.1.0"
description = "Compose tools that discover, activate, and read agent skills."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "sdk", "skillset", "toolkits"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["swarmauri_base>=0.11.0.dev6,<0.12","swarmauri_tool_listskills>=0.1.0,<0.2","swarmauri_tool_inspectskill>=0.1.0,<0.2","swarmauri_tool_activateskill>=0.1.0,<0.2","swarmauri_tool_readskillresource>=0.1.0,<0.2"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.toolkits"]
SkillsetToolkit = "swarmauri_toolkit_skillset:SkillsetToolkit"

[tool.uv.sources]
swarmauri_base = { workspace = true }
swarmauri_tool_listskills = { workspace = true }
swarmauri_tool_inspectskill = { workspace = true }
swarmauri_tool_activateskill = { workspace = true }
swarmauri_tool_readskillresource = { workspace = true }

[tool.pytest.ini_options]
markers = ["unit: Unit tests", "i9n: Integration tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.9"]
