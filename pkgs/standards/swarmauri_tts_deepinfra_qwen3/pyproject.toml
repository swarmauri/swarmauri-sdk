[project]
name = "swarmauri_tts_deepinfra_qwen3"
version = "0.1.0a1"
description = "Alpha Swarmauri Deepinfra Qwen3 text-to-speech provider with native JSON audio, async synthesis and bounded batches; live API verification pending."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["swarmauri", "deepinfra_qwen3", "tts", "text-to-speech", "speech-synthesis", "json-audio", "async-audio", "alpha-provider"]
dependencies = ["swarmauri_base>=0.11.0.dev12,<0.12", "httpx>=0.27,<0.29", "pydantic>=2.0"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"
Issues = "https://github.com/swarmauri/swarmauri-sdk/issues"

[project.entry-points."swarmauri.tts"]
DeepInfraQwen3TTS = "swarmauri_tts_deepinfra_qwen3:DeepInfraQwen3TTS"

[tool.uv.sources]
swarmauri_base = { workspace = true }

[tool.pytest.ini_options]
markers = ["unit: Offline unit tests", "i9n: Opt-in live API tests that may incur charges"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "swarmauri"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/swarmauri/swarmauri-sdk"
ref = "master"
package_path = "pkgs/standards/swarmauri_tts_deepinfra_qwen3"
layer = "standards"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "swarmauri_tts_deepinfra_qwen3"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "tests/unit/test_readme_sources.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/standards/swarmauri_tts_deepinfra_qwen3/tests/unit/test_readme_sources.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/pkgs/standards/swarmauri_tts_deepinfra_qwen3/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/swarmauri/swarmauri-sdk/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/swarmauri/swarmauri-sdk/actions/workflows/readme-standards.yml"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.18", "ruff==0.15.21", "readme-standards==0.1.1; python_version >= \"3.11\""]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = [{ path = "NOTICE", format = ["sdist", "wheel"] }]
