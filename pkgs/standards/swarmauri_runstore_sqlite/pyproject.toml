[project]
name = "swarmauri_runstore_sqlite"
version = "0.1.0"
description = "SQLite checkpoint storage for resumable Swarmauri agent runs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "sqlite", "runstore", "checkpoint", "optimistic-concurrency"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["swarmauri_core>=0.11.0.dev7,<0.12", "swarmauri_base>=0.11.0.dev7,<0.12"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.run_stores"]
SqliteRunStore = "swarmauri_runstore_sqlite:SqliteRunStore"

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.9"]
