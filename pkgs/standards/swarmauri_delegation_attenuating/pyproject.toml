[project]
name = "swarmauri_delegation_attenuating"
version = "0.1.1"
description = "Delegate task authority with live ancestry checks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "delegations", "composition", "execution", "authorization"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["swarmauri_core>=0.11.0.dev8,<0.12", "swarmauri_base>=0.11.0.dev13,<0.12"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.delegations"]
AttenuatingDelegationService = "swarmauri_delegation_attenuating:AttenuatingDelegationService"

[tool.uv.sources]
swarmauri_workflow_documentassistant = { workspace = true }
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff==0.15.21", "swarmauri_workflow_documentassistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["unit: Unit tests", "i9n: Integration tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
