[project]
name = "swarmauri_conversation_compacting"
version = "0.1.0.dev0"
description = "A Swarmauri conversation with rolling summaries and configurable compaction."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
license = "Apache-2.0"
dependencies = ["swarmauri_base>=0.11.0.dev5", "swarmauri_standard"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["swarmauri", "conversation", "compaction", "summarization", "context window"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.conversations"]
CompactingConversation = "swarmauri_conversation_compacting:CompactingConversation"

[tool.uv.sources]
swarmauri_base = { workspace = true }
swarmauri_standard = { workspace = true }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.9"]

[tool.ruff]
extend = "../../pyproject.toml"
