[project]
name = "swarmauri_process_docker"
version = "0.1.0"
description = "Stream and control processes in a docker workspace with Python 3 installed."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "sdk", "docker", "execution"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["swarmauri_base>=0.11.0.dev6,<0.12","swarmauri_core>=0.11.0.dev6,<0.12","swarmauri_process_subprocess>=0.1.0,<0.2"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[tool.uv.sources]
swarmauri_base = { workspace = true }
swarmauri_core = { workspace = true }
swarmauri_process_subprocess = { workspace = true }

[tool.pytest.ini_options]
markers = ["unit: Unit tests", "i9n: Integration tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.9"]
