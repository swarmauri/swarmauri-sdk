[project]
name = "swarmauri_transport_websocket"
version = "0.1.0.dev1"
description = "Synchronous and asynchronous WebSocket client transport for Swarmauri."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
license = { file = "LICENSE" }
dependencies = ["websockets>=14", "swarmauri_core", "swarmauri_base"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["swarmauri", "websocket", "realtime", "bidirectional", "async"]

[tool.uv.sources]
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[project.entry-points."swarmauri.transports"]
WebSocketClient = "swarmauri_transport_websocket:WebSocketClient"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9.9"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = ["N999"]
