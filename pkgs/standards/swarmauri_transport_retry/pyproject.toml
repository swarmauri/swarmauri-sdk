[project]
name = "swarmauri_transport_retry"
version = "0.1.0.dev1"
description = "Policy-driven synchronous, asynchronous, and streaming HTTP retries for Swarmauri clients."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
license = { file = "LICENSE" }
dependencies = ["swarmauri_core"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["swarmauri", "http", "retry", "backoff", "transport", "async"]

[tool.uv.sources]
swarmauri_core = { workspace = true }

[project.entry-points."swarmauri.transports"]
RetryingHttpClient = "swarmauri_transport_retry:RetryingHttpClient"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9.9"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = ["N999"]
