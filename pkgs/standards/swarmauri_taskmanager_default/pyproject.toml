[project]
name = "swarmauri_taskmanager_default"
version = "0.1.0"
description = "Coordinate admitted tasks and execution lifecycle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["swarmauri", "tasks", "composition", "execution", "authorization"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["swarmauri_core", "swarmauri_base"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"

[project.entry-points."swarmauri.tasks"]
DefaultTaskManager = "swarmauri_taskmanager_default:DefaultTaskManager"

[tool.uv.sources]
swarmauri_execution_default = { workspace = true }
swarmauri_taskstore_sqlite = { workspace = true }
swarmauri_runstore_sqlite = { workspace = true }
swarmauri_standard = { workspace = true }
swarmauri_core = { workspace = true }
swarmauri_base = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff==0.15.21", "swarmauri_execution_default", "swarmauri_taskstore_sqlite", "swarmauri_runstore_sqlite", "swarmauri_standard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["unit: Unit tests", "i9n: Integration tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
