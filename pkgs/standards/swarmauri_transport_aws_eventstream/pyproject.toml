[project]
name = "swarmauri_transport_aws_eventstream"
version = "0.1.0.dev1"
description = "Amazon Bedrock bidirectional EventStream transport for Swarmauri live models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
license = { file = "LICENSE" }
dependencies = [
  "botocore>=1.35",
  "swarmauri_base",
  "swarmauri_core",
  "aws-sdk-bedrock-runtime~=0.2.0; python_version >= '3.12'",
]
keywords = [
  "swarmauri",
  "transport",
  "aws",
  "amazon bedrock",
  "eventstream",
  "bidirectional",
  "nova sonic",
  "smithy",
  "http2",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]

[tool.uv.sources]
swarmauri_base = { workspace = true }
swarmauri_core = { workspace = true }

[project.urls]
Homepage = "https://github.com/swarmauri/swarmauri-sdk"
Repository = "https://github.com/swarmauri/swarmauri-sdk"
Source = "https://github.com/swarmauri/swarmauri-sdk/tree/master/pkgs/standards/swarmauri_transport_aws_eventstream"
Documentation = "https://github.com/swarmauri/swarmauri-sdk/tree/master/pkgs/standards/swarmauri_transport_aws_eventstream#readme"

[project.entry-points."swarmauri.transports"]
AwsEventStreamClient = "swarmauri_transport_aws_eventstream:AwsEventStreamClient"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9.9"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = ["N999"]
