[project]
name = "swarmauri_tts_deepgram"
version = "0.1.0a1"
description = "Alpha Swarmauri Deepgram Aura text-to-speech provider with file synthesis, async execution, streaming and bounded batches; live API verification pending."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["swarmauri", "deepgram", "tts", "text-to-speech", "speech-synthesis", "audio-streaming", "async-audio", "alpha-provider"]
dependencies = ["swarmauri_base>=0.11.0.dev9,<0.12", "httpx>=0.27", "pydantic>=2.0"]

[project.urls]
Repository = "https://github.com/swarmauri/swarmauri-sdk"
Issues = "https://github.com/swarmauri/swarmauri-sdk/issues"

[project.entry-points."swarmauri.tts"]
DeepgramTTS = "swarmauri_tts_deepgram:DeepgramTTS"

[tool.uv.sources]
swarmauri_base = { workspace = true }

[tool.pytest.ini_options]
markers = ["unit: Offline unit tests", "i9n: Opt-in live API tests that may incur charges"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.15.21"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
