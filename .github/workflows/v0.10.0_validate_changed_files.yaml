# File: .github/workflows/validate.yml
# Workflow: v0.10.0-Changes-Validate

name: v0.10.0-Changes-Validate

on:
  pull_request:
    paths:
      - 'pkgs/**'
  workflow_dispatch:

jobs:
  detect-changed-files:
    if: ${{ !cancelled() }}
    runs-on: [testing]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      overflow_matrix: ${{ steps.detect.outputs.overflow_matrix }}

    steps:
      # ──────────────────────────────────────────────────────────────────────────
      # Step: Check out code ─ (uses: actions/checkout@v4)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # fetch full history for diffing

      # ──────────────────────────────────────────────────────────────────────────
      # Step: Get changed files  (id=files)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Get changed files
        id: files
        run: |
          set -eo pipefail
          echo "Collecting changed files …"
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > changed_files.txt
          cat changed_files.txt

      # ──────────────────────────────────────────────────────────────────────────
      # Step: Detect changes and generate package matrix (id=detect)
      # Function: find_pyproject_root   (Bash function)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Detect changes and generate test matrix
        id: detect
        run: |
          echo "Detecting changed packages …"
          # Exclude the monorepo root pyproject.toml as it does not represent
          # a real package and will always fail validation.
          CHANGED_FILES=$(grep '^pkgs/' changed_files.txt | grep -v '^pkgs/pyproject.toml$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes in pkgs/. Exiting."
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo 'overflow_matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A PACKAGE_SET         # <package_path> ⇒ 1

          # ── Function: find_pyproject_root ────────────────────────────────────
          find_pyproject_root() {
            local path="$1"
            while true; do
              [[ -f "$path/pyproject.toml" ]] && { echo "$path"; return; }
              [[ "$path" == "." ]] && { echo ""; return; }
              path="$(dirname "$path")"
            done
          }
          # ─────────────────────────────────────────────────────────────────────

          for FILE in $CHANGED_FILES; do
            DIR=$(dirname "$FILE")
            PKG_ROOT=$(find_pyproject_root "$DIR")
            if [[ -z "$PKG_ROOT" || "$PKG_ROOT" == "pkgs" ]]; then
              continue
            fi
            PKG_PATH="${PKG_ROOT#pkgs/}"          # strip leading pkgs/
            PACKAGE_SET["$PKG_PATH"]=1            # record the package
          done

          # Each GitHub Actions matrix can expand to at most 256 jobs.
          MATRIX="["
          OVERFLOW_MATRIX="["
          count=0
          while IFS= read -r PKG; do
            [[ -n "$PKG" ]] || continue
            printf -v ENTRY '{"package_path":"%s","tests":""},' "$PKG"
            if (( count < 256 )); then
              MATRIX+="$ENTRY"
            else
              OVERFLOW_MATRIX+="$ENTRY"
            fi
            count=$((count + 1))
          done < <(printf '%s\n' "${!PACKAGE_SET[@]}" | LC_ALL=C sort)
          if (( count > 512 )); then
            echo "::error::Detected $count packages, exceeding the two 256-job matrices."
            exit 1
          fi
          echo "matrix=${MATRIX%,}]" >> "$GITHUB_OUTPUT"
          echo "overflow_matrix=${OVERFLOW_MATRIX%,}]" >> "$GITHUB_OUTPUT"
          echo "Detected $count packages for validation."

  # ─────────────────────────────────────────────────────────────────────────────
  # Job: run-tests  – executes once per package reported in matrix
  # ─────────────────────────────────────────────────────────────────────────────
  run-tests:
    needs: detect-changed-files
    if: ${{ !cancelled() && needs.detect-changed-files.result == 'success' && needs.detect-changed-files.outputs.matrix != '[]' }}
    runs-on: [testing]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package_tests: ${{ fromJSON(needs.detect-changed-files.outputs.matrix) }}

    env: &package-test-env
      UNIQUE_VENV_PATH: "${{ github.workspace }}/.venv_core_${{ github.run_id }}"
      # Meson editable installs refer to the temporary isolated build tools.
      UV_NO_EDITABLE: ${{ (startsWith(matrix.package_tests.package_path, 'experimental/RapidSimilarity/') || matrix.package_tests.package_path == 'experimental/swarmauri_crypto_sodium') && 'true' || 'false' }}

    steps: &package-test-steps
      # ────────────────────────────────────────────────────────────────────────
      # Step: Check out code ─ (uses: actions/checkout@v4)
      # ────────────────────────────────────────────────────────────────────────
      - name: Check out code
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────────────
      # Step: Set up Python ─ (uses: actions/setup-python@v5)
      # ────────────────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ────────────────────────────────────────────────────────────────────────
      # Step: Create & activate venv
      # ────────────────────────────────────────────────────────────────────────
      - name: Create and activate virtual environment
        run: |
          python -m venv "$UNIQUE_VENV_PATH"
          source "$UNIQUE_VENV_PATH/bin/activate"

      # ────────────────────────────────────────────────────────────────────────
      # Step: Install dependencies
      # ────────────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          source "$UNIQUE_VENV_PATH/bin/activate"
          python -m pip install --upgrade pip
          pip install uv poetry toml

      # ────────────────────────────────────────────────────────────────────────
      # Step: Ruff Format  (package_path only)
      # ────────────────────────────────────────────────────────────────────────
      - name: Ruff Format
        run: |
          source "$UNIQUE_VENV_PATH/bin/activate"
          PKG_PATH="${{ matrix.package_tests.package_path }}"
          echo "Running ruff format on pkgs/$PKG_PATH"
          cd pkgs
          PACKAGE_NAME=$(python -c "import toml, pathlib, sys; print(toml.load(pathlib.Path('$PKG_PATH')/'pyproject.toml')['project']['name'])")
          uv run --directory "$PKG_PATH" --package "$PACKAGE_NAME" --isolated --active --with "ruff==0.15.21" ruff format . --config "${{ github.workspace }}/pkgs/pyproject.toml"

      # ────────────────────────────────────────────────────────────────────────
      # Step: Ruff Check  (package_path only)
      # ────────────────────────────────────────────────────────────────────────
      - name: Ruff Check
        run: |
          source "$UNIQUE_VENV_PATH/bin/activate"
          PKG_PATH="${{ matrix.package_tests.package_path }}"
          echo "Running ruff check on pkgs/$PKG_PATH"
          cd pkgs
          PACKAGE_NAME=$(python -c "import toml, pathlib, sys; print(toml.load(pathlib.Path('$PKG_PATH')/'pyproject.toml')['project']['name'])")
          uv run --directory "$PKG_PATH" --package "$PACKAGE_NAME" --isolated --active --with "ruff==0.15.21" ruff check . --fix --config "${{ github.workspace }}/pkgs/pyproject.toml"

      # ────────────────────────────────────────────────────────────────────────
      # Step: Run Pytests  (run all tests in package)
      # ────────────────────────────────────────────────────────────────────────
      - name: Run Pytests
        run: |
          set -o pipefail
          source "$UNIQUE_VENV_PATH/bin/activate"
          PKG_PATH="${{ matrix.package_tests.package_path }}"
          echo "Running pytest in pkgs/$PKG_PATH"
          cd pkgs
          PACKAGE_NAME=$(python -c "import toml, pathlib, sys; print(toml.load(pathlib.Path('$PKG_PATH')/'pyproject.toml')['project']['name'])")
          export PKG_PATH PACKAGE_NAME
          case "$PKG_PATH" in
            community/swarmauri_parser_textblob)
              corpora=(punkt_tab averaged_perceptron_tagger_eng brown wordnet)
              ;;
            community/swarmauri_tool_dalechallreadability)
              corpora=(cmudict)
              ;;
            community/swarmauri_tool_lexicaldensity)
              corpora=(punkt_tab averaged_perceptron_tagger_eng)
              ;;
            community/swarmauri_tool_sentencecomplexity|community/swarmauri_tool_smogindex|community/swarmauri_tool_textlength)
              corpora=(punkt_tab)
              ;;
            *)
              corpora=()
              ;;
          esac
          if (( ${#corpora[@]} )); then
            export NLTK_DATA="$RUNNER_TEMP/nltk_data"
            mkdir -p "$NLTK_DATA"
            uv run --directory "$PKG_PATH" --package "$PACKAGE_NAME" --isolated --active \
              python - "${corpora[@]}" <<'PY'
          import os
          import sys

          import nltk

          nltk.download(
              sys.argv[1:], download_dir=os.environ["NLTK_DATA"], raise_on_error=True
          )
          PY
          fi
          set +e
          uv run --directory "$PKG_PATH" --package "$PACKAGE_NAME" --isolated --active pytest -vvv | tee pytest.log
          STATUS=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          import os, re, pathlib
          pkg_name = os.environ.get("PACKAGE_NAME", "unknown")
          pkg_path = os.environ.get("PKG_PATH", "")
          log = pathlib.Path('pytest.log').read_text().splitlines()[-1]
          patterns = {
              'passed': r'(\d+) passed',
              'failed': r'(\d+) failed',
              'xfailed': r'(\d+) xfailed',
              'xpassed': r'(\d+) xpassed',
              'skipped': r'(\d+) skipped',
              'warnings': r'(\d+) warnings?',
              'errors': r'(\d+) errors?'
          }
          counts = {k: 0 for k in patterns}
          for key, pat in patterns.items():
              m = re.search(pat, log)
              if m:
                  counts[key] = int(m.group(1))
          summary = " ".join(f"{k}={v}" for k, v in counts.items())
          print(f"::notice title=pytest summary ({pkg_name})::pkg_path={pkg_path} {summary}")
          PY
          if [[ "$STATUS" == 5 && ! -d "$PKG_PATH/tests" ]] &&
             [[ -z "$(find "$PKG_PATH" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]]; then
            echo "::notice::No pytest files in $PKG_PATH. Build and lint passed."
            exit 0
          fi
          exit "$STATUS"

  run-tests-overflow:
    needs: detect-changed-files
    if: ${{ !cancelled() && needs.detect-changed-files.result == 'success' && needs.detect-changed-files.outputs.overflow_matrix != '[]' }}
    runs-on: [testing]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package_tests: ${{ fromJSON(needs.detect-changed-files.outputs.overflow_matrix) }}
    env: *package-test-env
    steps: *package-test-steps
