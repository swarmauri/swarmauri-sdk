name: Package Index

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  package-index:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install index.toml-contracts==0.3.0
      - run: python -c "from index_toml_contracts import load; load('index.toml')"
      - run: python scripts/package_index.py --check
