name: Published README policy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  readme-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check package READMEs with the published policy
        run: uv run --no-project --with readme-standards==0.1.1 python .github/scripts/check_readme_policy.py
